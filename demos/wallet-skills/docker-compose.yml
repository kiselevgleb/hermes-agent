name: hermes-skills-demo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
      POSTGRES_DB: wallet
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-agent-ro.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 2s
      timeout: 5s
      retries: 30

  wallet-service:
    build:
      context: ./wallet-service
      # The commit is baked into the image at build time. It is not repeated under
      # environment, so recreating the container (scripts/break.sh) keeps the real value.
      args:
        GIT_COMMIT: ${GIT_COMMIT:-dev}
    environment:
      DATABASE_URL: postgresql://wallet:wallet@postgres:5432/wallet?schema=public
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-10}
      HOURLY_BET_LIMIT: ${HOURLY_BET_LIMIT:-10000000000}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  pgdata:
